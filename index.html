<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Reel Player</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Reel%20Player%22%2C%22short_name%22%3A%22Reels%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2314110f%22%2C%22theme_color%22%3A%22%2314110f%22%7D">
<style>
:root{--bg:#14110f;--card:#221d1a;--ink:#f3ece4;--mute:#a79c91;--acc:#ffb347;--line:#352e29}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:520px;margin:0 auto}
h1{font-size:1.4rem;margin:18px 0 12px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
button,a.btn{padding:14px 16px;border-radius:12px;border:0;background:var(--acc);color:#1a1209;font-weight:700;font-size:1rem;text-decoration:none;display:inline-block;text-align:center}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #fff}
#stage{margin:14px 0}
iframe{width:100%;border:0;border-radius:14px;background:#000;display:block}
#msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;line-height:1.45}
#msg p{margin:0 0 12px}
h2{font-size:1rem;color:var(--mute);margin:22px 0 8px;font-weight:600}
.hist{display:block;width:100%;text-align:left;margin-bottom:6px;padding:12px;font-weight:500;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Reel Player</h1>
<div class="row">
  <input id="u" type="url" inputmode="url" placeholder="Facebook or Instagram link" autocomplete="off">
  <button id="play">Play</button>
</div>
<div class="row" style="margin-top:8px">
  <button class="alt" id="paste" style="flex:1">Paste</button>
  <button class="alt" id="clear" style="flex:1">Clear</button>
</div>
<div id="msg" hidden></div>
<div id="stage"></div>
<h2 id="hh" hidden>Recent</h2>
<div id="hist"></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY="reelplayer.history";

  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function save(url){
    try{
      var h=load().filter(function(x){return x!==url});
      h.unshift(url);
      localStorage.setItem(KEY,JSON.stringify(h.slice(0,10)));
    }catch(e){}
    renderHist();
  }
  function renderHist(){
    var h=load(),box=$("hist");
    box.innerHTML="";
    $("hh").hidden=!h.length;
    h.forEach(function(url){
      var b=document.createElement("button");
      b.className="alt hist";b.textContent=url.replace(/^https?:\/\/(www\.)?/,"");
      b.onclick=function(){$("u").value=url;go(url)};
      box.appendChild(b);
    });
  }

  function parse(raw){
    raw=(raw||"").trim();
    var m=raw.match(/https?:\/\/[^\s]+/);
    if(!m)return null;
    var u;
    try{u=new URL(m[0])}catch(e){return null}
    var host=u.hostname.replace(/^(www|m|web|mbasic|l|lm)\./,"");
    var path=u.pathname;

    if(host==="instagram.com"||host==="instagr.am"){
      var r=path.match(/\/(reels?|p|tv)\/([A-Za-z0-9_-]+)/);
      if(!r)return {type:"open",url:m[0],why:"Could not find a reel code in this Instagram link."};
      var kind=r[1]==="reels"?"reel":r[1];
      return {type:"ig",embed:"https://www.instagram.com/"+kind+"/"+r[2]+"/embed",url:"https://www.instagram.com/"+kind+"/"+r[2]+"/"};
    }
    if(host==="facebook.com"||host==="fb.watch"||host==="fb.com"){
      var clean=u.origin+u.pathname;
      if(host==="facebook.com"&&u.pathname==="/watch/"&&u.searchParams.get("v"))clean="https://www.facebook.com/watch/?v="+u.searchParams.get("v");
      if(host==="facebook.com"&&(u.pathname==="/permalink.php"||u.pathname==="/story.php"))clean=u.href;
      return {type:"fb",embed:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(clean)+"&show_text=false&width=500",url:m[0]};
    }
    return {type:"open",url:m[0],why:"This is not a Facebook or Instagram link."};
  }

  function msg(html){var d=$("msg");d.innerHTML=html;d.hidden=!html}
  function openBtn(url){
    var a=document.createElement("a");
    a.className="btn";a.href=url;a.target="_blank";a.rel="noopener";a.textContent="Open original link";
    return a;
  }
  function note(text,url){
    var d=$("msg");d.innerHTML="";d.hidden=false;
    var p=document.createElement("p");p.textContent=text;d.appendChild(p);
    if(url)d.appendChild(openBtn(url));
  }

  function go(raw){
    $("stage").innerHTML="";msg("");
    var r=parse(raw);
    if(!r){note("No valid link found. Paste a full Facebook or Instagram link.");return}
    if(r.type==="open"){note(r.why,r.url);return}
    save(r.url);
    var f=document.createElement("iframe");
    f.src=r.embed;
    f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen=true;
    f.setAttribute("referrerpolicy","origin");
    var w=Math.min(window.innerWidth-28,500);
    f.style.height=(r.type==="ig"?Math.round(w*1.9):Math.round(w*1.15))+"px";
    $("stage").appendChild(f);
    note("Blank or says unavailable? The video is private or blocks embedding.",r.url);
  }

  $("play").onclick=function(){go($("u").value)};
  $("u").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go($("u").value)}});
  $("paste").onclick=async function(){
    try{$("u").value=await navigator.clipboard.readText();$("u").focus()}
    catch(e){note("Clipboard access is unavailable. Paste the link into the field.")}
  };
  $("clear").onclick=function(){$("u").value="";$("stage").innerHTML="";msg("");$("u").focus()};
  renderHist();
})();
</script>
</body>
</html>
